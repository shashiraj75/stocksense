name: Multibagger Fundamentals Refresh — US (Weekly)

on:
  schedule:
    # Product Integrity #010 (2026-07-16): replaced #009's two-DST-
    # candidate design (0 7 * * 0 EDT / 0 8 * * 0 EST) with ONE fixed
    # Sunday 08:00 UTC cron. This is a deliberate final decision, not an
    # oversight:
    #   - EST (winter): 08:00 UTC = 3:00 AM America/New_York.
    #   - EDT (summer): 08:00 UTC = 4:00 AM America/New_York.
    # A one-hour seasonal difference in when a WEEKLY long-term
    # fundamentals refresh starts is immaterial to the product; it is
    # materially SAFER than two candidate crons, which required the
    # backend to treat one as authoritative and the other as an expected
    # no-op, and left more surface for DST-window ambiguity bugs (see
    # Product Integrity #010's own forensic audit, which found the
    # weekly-period unique index predicate itself had drifted from its
    # intended definition in production despite the migration code looking
    # correct — the fewer moving parts here, the safer).
    #
    # This job has no dependency on, or coupling with, the Premarket
    # Finalizer or US Daily Picks base generation — the 2026-07-15
    # "cooperative stop" mechanism (Product Integrity #008) was removed in
    # #009 and stays removed. Weekly scheduling makes a real overlap with
    # US Daily Picks rare by design; the exceptional case is handled by a
    # durable US_YFINANCE_HEAVY lease (Product Integrity #010 §9), not by
    # one job stopping another.
    #
    # Expected US runtime: ~5-6 hours for ~5,300 common stocks — Sunday
    # 3/4:00-9/10:00 AM ET has no other scheduled heavy job anywhere near
    # it. The backend accepts this scheduled call for the full Sunday
    # America/New_York local day (not a narrow arrival window) — GitHub
    # Actions' own scheduled delivery is best-effort and has been observed
    # arriving hours late in this repository (Product Integrity #003).
    - cron: "0 8 * * 0"    # Sunday 08:00 UTC (3:00 AM EST / 4:00 AM EDT)
  workflow_dispatch:         # exceptional, explicitly authorized manual refresh only

jobs:
  refresh-fundamentals-us:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway backend is healthy
        run: |
          echo "Checking Railway backend at $(date -u) UTC..."
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://stocksense-production-7e0d.up.railway.app/health)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              break
            fi
            sleep 10
          done

      - name: Trigger US fundamentals refresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER_SOURCE="scheduled"
          else
            TRIGGER_SOURCE="manual"
          fi
          echo "Triggering US fundamentals refresh at $(date -u) UTC (trigger_source=$TRIGGER_SOURCE)..."

          # Bounded retry (Product Integrity #009/#010 §15/§18): 409
          # resource_busy and 503 durable_state_unavailable are retryable.
          # 422 outside_scheduled_day would mean this fired on the wrong
          # local weekday — not expected with a single fixed cron, but
          # handled as a safe no-op rather than a hard failure if it ever
          # occurs (e.g. a leap-second/clock edge case).
          MAX_ATTEMPTS=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/refresh_resp.json -w "%{http_code}" \
              -X POST \
              -H "x-secret: ${{ secrets.PICKS_SECRET }}" \
              "https://stocksense-production-7e0d.up.railway.app/api/multibagger/refresh?market=US&trigger_source=$TRIGGER_SOURCE")
            BODY=$(cat /tmp/refresh_resp.json)
            echo "Attempt $i: HTTP $HTTP_CODE — $BODY"

            case "$HTTP_CODE" in
              202)
                echo "US Multibagger refresh started — ~5,300 common stocks, expect 5-6 hours."
                exit 0
                ;;
              200)
                echo "US Multibagger refresh already completed/queued/running for this scheduled period — safe no-op."
                exit 0
                ;;
              422)
                echo "Outside the scheduled day — unexpected for a single fixed cron, but treated as a safe no-op."
                exit 0
                ;;
              409|503)
                if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                  echo "Retryable response ($HTTP_CODE) — waiting 60s before retry ($i/$MAX_ATTEMPTS)..."
                  sleep 60
                else
                  echo "Exhausted $MAX_ATTEMPTS attempts with retryable response $HTTP_CODE — giving up for this run."
                  exit 1
                fi
                ;;
              *)
                echo "Non-retryable response: HTTP $HTTP_CODE — not retrying."
                exit 1
                ;;
            esac
          done
