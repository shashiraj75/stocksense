name: Multibagger Fundamentals Refresh — US (Weekly)

on:
  schedule:
    # Product Integrity #009 (2026-07-16): converted from daily weekday
    # (08:00 UTC Mon-Fri, Product Integrity #008) to weekly. Most
    # financial-statement fundamentals change quarterly, not daily — a
    # daily full-universe yfinance scrape was unnecessary provider load,
    # Railway resource pressure, and daily scheduler-collision risk for
    # data that barely moves day to day.
    #
    # Target: Sunday 3:00 AM America/New_York. GitHub Actions cron is
    # UTC-only and does not observe US DST, so two fixed-UTC candidates are
    # required, same dual-cron pattern as the Premarket Finalizer
    # (Product Integrity #007):
    #   - EDT: 07:00 UTC Sunday = 3:00 AM ET
    #   - EST: 08:00 UTC Sunday = 3:00 AM ET
    # The backend is the DST-aware local-window authority — POST
    # /api/multibagger/refresh only accepts a scheduled call inside Sunday
    # 2:30-4:30 AM America/New_York (see services/multibagger_schedule.py's
    # us_scheduled_window()), so only the DST-active candidate actually
    # starts a job; the inactive one safely receives
    # outside_scheduled_window (422) and does nothing. Durable
    # weekly-period idempotency (scheduled_period_key) additionally means
    # that even if both candidates somehow landed inside the window on the
    # same real day (they can't under normal DST transitions, six months
    # apart), only the first would start a job — the second would see
    # already_completed_for_period.
    #
    # This job no longer has any dependency on, or coupling with, the
    # Premarket Finalizer or US Daily Picks base generation — the 2026-07-15
    # "cooperative stop" mechanism (Product Integrity #008) was removed in
    # #009. Weekly scheduling makes a real overlap with US Daily Picks rare
    # by design; the exceptional case is handled by a durable
    # US_YFINANCE_HEAVY lease, not by one job stopping another.
    #
    # Expected US runtime: ~5-6 hours for ~5,300 common stocks — Sunday
    # 3:00-9:00 AM ET has no other scheduled heavy job anywhere near it.
    - cron: "0 7 * * 0"    # Sunday 07:00 UTC — EDT candidate (3:00 AM ET)
    - cron: "0 8 * * 0"    # Sunday 08:00 UTC — EST candidate (3:00 AM ET)
  workflow_dispatch:         # exceptional, explicitly authorized manual refresh only

jobs:
  refresh-fundamentals-us:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway backend is healthy
        run: |
          echo "Checking Railway backend at $(date -u) UTC..."
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://stocksense-production-7e0d.up.railway.app/health)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              break
            fi
            sleep 10
          done

      - name: Trigger US fundamentals refresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER_SOURCE="scheduled"
          else
            TRIGGER_SOURCE="manual"
          fi
          echo "Triggering US fundamentals refresh at $(date -u) UTC (trigger_source=$TRIGGER_SOURCE)..."

          # Bounded retry (Product Integrity #009 §15): 409 resource_busy and
          # 503 durable_state_unavailable are retryable; 422
          # outside_scheduled_window means the INACTIVE DST candidate fired —
          # that is an expected, non-retryable, safe no-op, not a failure.
          MAX_ATTEMPTS=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/refresh_resp.json -w "%{http_code}" \
              -X POST \
              -H "x-secret: ${{ secrets.PICKS_SECRET }}" \
              "https://stocksense-production-7e0d.up.railway.app/api/multibagger/refresh?market=US&trigger_source=$TRIGGER_SOURCE")
            BODY=$(cat /tmp/refresh_resp.json)
            echo "Attempt $i: HTTP $HTTP_CODE — $BODY"

            case "$HTTP_CODE" in
              202)
                echo "US Multibagger refresh started — ~5,300 common stocks, expect 5-6 hours."
                exit 0
                ;;
              200)
                echo "US Multibagger refresh already completed/queued/running for this scheduled period — safe no-op."
                exit 0
                ;;
              422)
                echo "Outside the scheduled window — this is the inactive DST candidate for today's offset. Expected, not an error."
                exit 0
                ;;
              409|503)
                if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                  echo "Retryable response ($HTTP_CODE) — waiting 60s before retry ($i/$MAX_ATTEMPTS)..."
                  sleep 60
                else
                  echo "Exhausted $MAX_ATTEMPTS attempts with retryable response $HTTP_CODE — giving up for this run."
                  exit 1
                fi
                ;;
              *)
                echo "Non-retryable response: HTTP $HTTP_CODE — not retrying."
                exit 1
                ;;
            esac
          done
