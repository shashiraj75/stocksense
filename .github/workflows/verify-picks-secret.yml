name: Verify PICKS_SECRET (Railway ↔ GitHub sync check)

# Diagnostic-only workflow: confirms this repo's PICKS_SECRET matches the
# value currently deployed on Railway, using the existing read-only
# /api/predictions/debug/state endpoint (same X-Secret model as
# /api/picks/generate, but it returns only aggregate in-memory counters —
# no picks, no per-symbol data, no database write, no generation of any
# kind). Manual trigger only; never scheduled, so it can never race or
# duplicate a real Daily Picks / Multibagger run. See the Learning Alpha
# Engine PICKS_SECRET rotation verification work for why this exists.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-picks-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Railway backend is healthy
        run: |
          echo "Checking Railway backend health at $(date -u) UTC..."
          HEALTHY=0

          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://stocksense-production-7e0d.up.railway.app/health)
            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Server is healthy."
              HEALTHY=1
              break
            fi

            sleep 10
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "Railway backend is not healthy after 5 attempts. Aborting."
            exit 1
          fi

      - name: Verify PICKS_SECRET against /api/predictions/debug/state
        run: |
          # -o /dev/null discards the response body entirely — it is never
          # captured into a variable, logged, or echoed. -w "%{http_code}"
          # is the only thing read back from curl. The secret is used only
          # inline in this one -H header argument; it is never echoed,
          # exported, or referenced anywhere else in this workflow.
          # `|| STATUS="000"` catches a true network/connection failure
          # (curl itself exiting non-zero, e.g. DNS or TLS failure) so the
          # step falls through to the clean FAIL path below instead of
          # aborting under bash's default -e for GitHub Actions `run:` steps.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "x-secret: ${{ secrets.PICKS_SECRET }}" \
            "https://stocksense-production-7e0d.up.railway.app/api/predictions/debug/state") || STATUS="000"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "picks_secret_check: PASS"
            exit 0
          else
            echo "picks_secret_check: FAIL"
            exit 1
          fi
