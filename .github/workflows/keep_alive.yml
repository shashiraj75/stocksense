name: Keep Server Alive

# Scheduled trigger retired (GitHub Actions cost issue #114): Railway runs the
# API as one continuous replica (no sleep/serverless mode), so a 10-minute
# GitHub cron was only curl-ing /health (144 runs/day). Kept as a manual
# operator diagnostic. Do not re-add a frequent GitHub schedule; use real
# uptime monitoring if alerting is needed.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway backend health endpoint
        run: |
          curl -sS --max-time 30 \
            https://stocksense-production-7e0d.up.railway.app/health \
            && echo "Server is alive" \
            || echo "Ping failed"
