name: Daily Stock Picks — US Premarket Finalizer

# GitHub Actions cron is UTC-only and does not observe US daylight saving
# time, so two fixed-UTC schedules are used to approximate the same
# 6:00 AM New York local time year-round. The backend endpoint itself is
# the source of truth for whether it is actually inside the allowed
# premarket window (America/New_York, DST-aware via zoneinfo) — one of
# these two triggers will always land inside the window and run, the
# other will always land outside the window and safely no-op. The US base
# workflow (daily_picks_us.yml) must complete and durably persist its
# picks first — this finalizer only ever re-checks an already-generated
# base, it never generates one itself (see premarket_finalizer.py).
#
# 2026-07-15 change: moved from ~7:35 AM ET to 6:00 AM ET so 6:00 AM ET
# becomes the authoritative finalization attempt, with the backend's
# acceptance window correspondingly narrowed and shifted to 6:00-7:30 AM ET
# (still ~90 minutes, absorbing the same class of GitHub Actions dispatch
# delay documented below — see in_premarket_window() in
# premarket_finalizer.py). This did NOT reintroduce the missed-run failure
# mode the 2026-07-13 change (see CHANGELOG.md and Product-Integrity docs
# for that history, left unchanged as historical evidence) fixed: this
# window is the same ~90-minute width, just retargeted earlier, and the two
# fixed-UTC candidates below still straddle it the same way for both DST
# offsets. GitHub Actions scheduled triggers remain best-effort and can run
# late; this class of delay is absorbed, a pathological multi-hour delay
# (this repo has seen one on a different Daily Picks workflow, see
# Product-Integrity-001C) is not, a known, accepted residual risk.
on:
  schedule:
    # EDT candidate: 10:00 UTC = 6:00 AM New York during EDT (Mar-Nov)
    - cron: "0 10 * * 1-5"
    # EST candidate: 11:00 UTC = 6:00 AM New York during EST (Nov-Mar)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  premarket-finalize-us:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway backend is healthy
        run: |
          echo "Checking Railway backend at $(date -u) UTC..."
          HEALTHY=0

          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://stocksense-production-7e0d.up.railway.app/health)
            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              HEALTHY=1
              break
            fi

            sleep 10
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "Railway backend is not healthy after 5 attempts."
            exit 1
          fi

      - name: Trigger US premarket finalizer
        run: |
          echo "Triggering US premarket finalizer at $(date -u) UTC..."
          RESPONSE=$(curl -sS --fail-with-body --max-time 30 \
            -X POST \
            -H "x-secret: ${{ secrets.PICKS_SECRET }}" \
            "https://stocksense-production-7e0d.up.railway.app/api/picks/premarket-finalize?market=US")
          echo "$RESPONSE"
          echo ""
          echo "Premarket finalizer call complete. The backend guards execution to the"
          echo "6:00-7:30 AM America/New_York window and safely no-ops outside it (e.g."
          echo "the EDT/EST candidate that isn't the active DST offset today)."
