name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_tests.yml"

# Cancel a superseded PR run when a newer commit lands on the same PR. Push
# runs (main) get a per-SHA group, so they are never cancelled or replaced by
# a newer pending run - every main execution stays auditable and its check
# suite stays intact for Railway's wait-for-CI deploy gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Type check
        run: npx tsc --noEmit
