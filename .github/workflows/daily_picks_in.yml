name: Daily Stock Picks — India 2:07 AM IST

on:
  schedule:
    # India: 20:37 UTC = 2:07 AM IST next day = 0:37 AM Dubai
    # Sun–Thu UTC = Mon–Fri IST market days
    - cron: "37 20 * * 0-4"
  workflow_dispatch:

jobs:
  generate-picks-in:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Railway backend is healthy
        run: |
          echo "Checking Railway backend at $(date -u) UTC..."
          HEALTHY=0

          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://stocksense-production-7e0d.up.railway.app/health)
            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              HEALTHY=1
              break
            fi

            sleep 10
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "Railway backend is not healthy after 5 attempts."
            exit 1
          fi

      - name: Trigger India pick generation
        id: trigger
        run: |
          echo "Triggering IN daily picks generation at $(date -u) UTC..."
          HTTP_CODE=$(curl -sS --max-time 30 -o "${RUNNER_TEMP}/in_trigger_body.json" -w "%{http_code}" \
            -X POST \
            -H "x-secret: ${{ secrets.PICKS_SECRET }}" \
            "https://stocksense-production-7e0d.up.railway.app/api/picks/generate?market=IN")
          echo "Trigger HTTP code: $HTTP_CODE"
          echo "Trigger response body: $(cat "${RUNNER_TEMP}/in_trigger_body.json")"
          # Follow-up correction (2026-08-10): the trigger response body is
          # handed off via the on-disk file at RUNNER_TEMP (shared across
          # steps in this job), never through a GITHUB_OUTPUT
          # expression-interpolation round-trip. Only the numeric HTTP code
          # (never free-form backend text) crosses that boundary, so a
          # response body containing a quote, apostrophe, or newline can
          # never break shell quoting or get interpolated as shell content
          # in the next step.
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify India pick generation actually completed and published
        run: |
          chmod +x scripts/ci/poll_daily_picks_completion.sh
          TRIGGER_BODY="$(cat "${RUNNER_TEMP}/in_trigger_body.json")"
          scripts/ci/poll_daily_picks_completion.sh \
            "https://stocksense-production-7e0d.up.railway.app" \
            "IN" \
            "${{ steps.trigger.outputs.http_code }}" \
            "$TRIGGER_BODY"