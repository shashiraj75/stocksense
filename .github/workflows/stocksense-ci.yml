name: StockSense360 Core Engine Pipeline

# Structural syntax check only (flake8 E9/F63/F7/F82) - the pytest step was
# never enabled. Narrowed to Python/workflow changes so docs/frontend-only
# commits no longer spin up a second Python environment (issue #114). The
# workflow and job names are unchanged, so any check referencing them keeps
# working. Real test execution lives in backend_tests.yml.
on:
  push:
    branches: [ main ]
    paths:
      - "**/*.py"
      - ".github/workflows/stocksense-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - ".github/workflows/stocksense-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # unchanged: flake8 syntax check only

    - name: Install flake8
      run: python -m pip install flake8

    - name: Verify Mathematical and Code Syntax
      run: |
        # Fail the build if critical structural gaps are detected
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
