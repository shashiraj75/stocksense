name: Daily Picks Publication Health

on:
  # After both weekday worker windows. Weekday holiday runs are still
  # expected by the existing generation-date contract; no weekend checks.
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/daily_picks_publication_health.yml"
      - "backend/scripts/check_daily_picks_health.py"

permissions:
  contents: read

jobs:
  publication-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check completed publications (read-only)
        run: python backend/scripts/check_daily_picks_health.py
