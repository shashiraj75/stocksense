name: Daily Stock Picks — US Pre-Open

on:
  schedule:
    # US base run: 06:00 UTC = 10:00 AM Dubai = 11:30 AM IST
    # This is the heavy/full Daily Picks base run — a lightweight premarket
    # finalizer (daily_picks_us_premarket.yml) runs separately at ~6:00 AM
    # America/New_York to review/finalize these already-persisted base
    # picks. It never generates a base itself, so this run must complete
    # and durably persist first.
    #
    # 2026-07-15 change (Daily Stock Picks — US Premarket Finalizer moved to
    # 6:00 AM ET): the previous 04:00 UTC schedule is incompatible with the
    # finalizer's same-ET-calendar-day provenance requirement during EST.
    # 04:00 UTC during EST (UTC-5) is 23:00 ET the PREVIOUS calendar date —
    # a base generated then is permanently stale from the finalizer's
    # perspective the next ET morning (generated_at.date() != today), so
    # the finalizer would reject every EST-season base as
    # skipped_stale_base regardless of any finalizer schedule change (see
    # premarket_finalizer.py's validate_base_for_finalization() check E).
    # 06:00 UTC avoids this in both DST offsets: EDT (UTC-4) -> 02:00 ET,
    # EST (UTC-5) -> 01:00 ET, both same-calendar-day and several hours
    # before either 6:00 AM ET finalizer candidate, leaving ample execution
    # buffer. This also incidentally fixes a related latent bug in
    # services.daily_picks.picks_generated_today("US"), which compares
    # generated_at against today's ET date the same way and would have
    # under-counted "already generated today" during EST for the same
    # reason.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  generate-picks-us:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Railway backend is healthy
        run: |
          echo "Checking Railway backend at $(date -u) UTC..."
          HEALTHY=0

          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://stocksense-production-7e0d.up.railway.app/health)
            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              HEALTHY=1
              break
            fi

            sleep 10
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "Railway backend is not healthy after 5 attempts."
            exit 1
          fi

      - name: Trigger US pick generation
        id: trigger
        run: |
          echo "Triggering US daily picks generation at $(date -u) UTC..."
          HTTP_CODE=$(curl -sS --max-time 30 -o "${RUNNER_TEMP}/us_trigger_body.json" -w "%{http_code}" \
            -X POST \
            -H "x-secret: ${{ secrets.PICKS_SECRET }}" \
            "https://stocksense-production-7e0d.up.railway.app/api/picks/generate?market=US")
          echo "Trigger HTTP code: $HTTP_CODE"
          # Follow-up correction (2026-08-10, diagnostics/log-safety
          # hardening): only bounded, known-safe fields are echoed — see
          # daily_picks_in.yml for the full rationale. The RUNNER_TEMP
          # file-based handoff itself is unchanged.
          echo "Trigger response (safe fields): $(jq -c '{status, market, job_id}' "${RUNNER_TEMP}/us_trigger_body.json" 2>/dev/null || echo '{"parse_error":true}')"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify US pick generation actually completed and published
        run: |
          chmod +x scripts/ci/poll_daily_picks_completion.sh
          TRIGGER_BODY="$(cat "${RUNNER_TEMP}/us_trigger_body.json")"
          scripts/ci/poll_daily_picks_completion.sh \
            "https://stocksense-production-7e0d.up.railway.app" \
            "US" \
            "${{ steps.trigger.outputs.http_code }}" \
            "$TRIGGER_BODY"